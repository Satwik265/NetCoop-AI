[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "gateway*", "orchestrator*", "mcp_server*", "api*", "cli*", "data*", "storage*", "remediation*", "llm*", "netcoop*"]

[project]
name = "netcoop-ai"
version = "1.0.0"
description = "Multi-agent network fault diagnosis and simulated remediation system"
authors = [{ name = "Team inSANE MITRA", email = "satwikj9@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlmodel>=0.0.16",
    "langgraph>=0.0.30",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "jsonschema>=4.21.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
]
llm = [
    "google-genai>=0.1.1",
]

[project.scripts]
netcoop = "netcoop.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
markers = [
    "strict_isolation: tests verifying strict HTTP process isolation and fail-closed semantics",
]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
