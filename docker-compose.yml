version: "3.9"

services:
  orchestrator-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netcoop-orchestrator
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - BIND_HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./netcoop.db
      - AGENTS_MODE=http
      - IN_PROCESS_FALLBACK=false
      - TELEMETRY_AGENT_HOST=telemetry-agent
      - TOPOLOGY_AGENT_HOST=topology-agent
      - CONFIG_AGENT_HOST=config-agent
      - LOG_AGENT_HOST=log-agent
      - SYNTHESIZER_AGENT_HOST=synthesizer-agent
      - GATEWAY_HOST=gateway
      - CLASSIFIER_AGENT_HOST=classifier-agent
      - WIFI_SERVICES_AGENT_HOST=wifi-services-agent
      - TELEMETRY_AGENT_PORT=8001
      - TOPOLOGY_AGENT_PORT=8002
      - CONFIG_AGENT_PORT=8003
      - LOG_AGENT_PORT=8004
      - SYNTHESIZER_AGENT_PORT=8005
      - GATEWAY_PORT=8006
      - CLASSIFIER_AGENT_PORT=8007
      - WIFI_SERVICES_AGENT_PORT=8008
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    volumes:
      - ./data:/app/data
      - netcoop-db:/app/storage
    depends_on:
      telemetry-agent:
        condition: service_healthy
      topology-agent:
        condition: service_healthy
      config-agent:
        condition: service_healthy
      log-agent:
        condition: service_healthy
      synthesizer-agent:
        condition: service_healthy
      gateway:
        condition: service_healthy
      classifier-agent:
        condition: service_healthy
      wifi-services-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  telemetry-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netcoop-telemetry-agent
    command: ["python", "-m", "agents.server", "--role", "telemetry_agent", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  topology-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netcoop-topology-agent
    command: ["python", "-m", "agents.server", "--role", "topology_agent", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  config-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netcoop-config-agent
    command: ["python", "-m", "agents.server", "--role", "config_agent", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "8003:8003"
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  log-agent:
